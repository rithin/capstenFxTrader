[project]
name = "capsten-fake-events"
version = "0.1.0"
description = "Capsten fake-events. Stub for M11; real implementation in M0.4 (fake event publisher)."
requires-python = ">=3.13,<3.15"
dependencies = [
    "redis==8.1.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
