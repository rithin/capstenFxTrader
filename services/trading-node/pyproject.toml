[project]
name = "capsten-trading-node"
version = "0.1.0"
description = "Capsten trading-node. Stub for M11; real implementation in M1 (trading node)."
requires-python = ">=3.13,<3.15"
dependencies = [
    "redis==8.1.0",
    "nautilus_trader==2.0.0rc7",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
