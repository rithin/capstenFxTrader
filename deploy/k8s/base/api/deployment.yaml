apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
    spec:
      containers:
        - name: api
          image: capsten/api
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: capsten-config}
            - secretRef: {name: capsten-secrets}
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
