# Runs Alembic migrations with the api image. The Makefile deletes and re-applies it on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: {app.kubernetes.io/name: db-migrate}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: db-migrate}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: capsten/api
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef: {name: capsten-config}
            - secretRef: {name: capsten-secrets}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
