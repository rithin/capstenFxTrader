apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  labels: {app.kubernetes.io/name: backtest-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backtest-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backtest-worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backtest-worker
          image: capsten/backtest-worker
          ports: [{name: health, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: capsten-config}
            - secretRef: {name: capsten-secrets}
          env:
            - {name: SERVICE_NAME, value: backtest-worker}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 2Gi}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
