apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs}
spec:
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: master, port: 9333, targetPort: 9333}
    - {name: filer, port: 8888, targetPort: 8888}
    # gRPC ports (HTTP port + 10000), used by `weed shell` in the s3-init job
    - {name: master-grpc, port: 19333, targetPort: 19333}
    - {name: filer-grpc, port: 18888, targetPort: 18888}
