# Creates the buckets. Idempotent; the Makefile deletes and re-applies it on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  labels: {app.kubernetes.io/name: s3-init}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: s3-init}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: chrislusf/seaweedfs:4.48
          command: [sh, -c]
          args:
            - |
              set -e
              until wget -qO- http://seaweedfs:9333/cluster/status >/dev/null; do sleep 3; done
              existing=$(echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null || true)
              for b in backtests backups; do
                if echo "$existing" | grep -qw "$b"; then echo "bucket $b exists"
                else echo "s3.bucket.create -name $b" | weed shell -master=seaweedfs:9333; echo "bucket $b created"; fi
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
