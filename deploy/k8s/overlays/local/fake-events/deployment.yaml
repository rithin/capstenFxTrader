apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-events
  labels: {app.kubernetes.io/name: fake-events}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fake-events}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-events}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fake-events
          image: capsten/fake-events
          ports: [{name: health, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: capsten-config}
            - secretRef: {name: capsten-secrets}
          env:
            - {name: SERVICE_NAME, value: fake-events}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
