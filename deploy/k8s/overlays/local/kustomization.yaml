# Local k3d overlay. Rendered and applied by `make deploy` (part of `make install`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capsten
labels:
  - pairs:
      app.kubernetes.io/part-of: capsten
    includeSelectors: false
resources:
  - namespace.yaml
  - ../../base
  - fake-events          # local only: simulated event stream (M0.4)

images:
  - {name: capsten/api, newName: localhost:5111/capsten/api, newTag: dev}
  - {name: capsten/web, newName: localhost:5111/capsten/web, newTag: dev}
  - {name: capsten/trading-node, newName: localhost:5111/capsten/trading-node, newTag: dev}
  - {name: capsten/recorder, newName: localhost:5111/capsten/recorder, newTag: dev}
  - {name: capsten/backtest-worker, newName: localhost:5111/capsten/backtest-worker, newTag: dev}
  - {name: capsten/fake-events, newName: localhost:5111/capsten/fake-events, newTag: dev}

configMapGenerator:
  - name: capsten-config
    behavior: merge
    literals:
      - ENVIRONMENT=local
      - LOG_FORMAT=console
      - TRADING_MODE=sandbox

# secrets/ is git-ignored and written by `make secrets` from the root .env
secretGenerator:
  - name: capsten-secrets
    envs: [secrets/app.env]
  - name: capsten-s3-config
    files: [secrets/s3.json]

generatorOptions:
  disableNameSuffixHash: false   # config/secret changes roll the pods automatically

patches:
  # `dev` tag is rebuilt in place, so always pull it
  - target: {kind: Deployment, labelSelector: "app.kubernetes.io/part-of=capsten"}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: {kind: Job, name: db-migrate}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
